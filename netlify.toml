# The city files live on the orphan "data" branch, published by .github/workflows/data.yml.
# The build pulls them in, then builds the app.
[build]
  command = "npm run data && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
