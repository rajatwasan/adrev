# Netlify builds the app from the city file committed in public/data.
# The data itself is refreshed by .github/workflows/data.yml.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
