name: Refresh Overture extract

# Pulls every city in scripts/cities.json from Overture, checks the result, and publishes it to the
# orphan "data" branch (force pushed, so the repo does not grow each month). Netlify pulls that
# branch at build time; a small stamp commit on main triggers the redeploy.
on:
  push:
    branches: [main, global]
    paths:
      - scripts/extract.py
      - scripts/cities.json
      - scripts/requirements.txt
      - .github/workflows/data.yml
  schedule:
    - cron: '17 9 25 * *' # monthly, a few days after Overture's usual release
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data
  cancel-in-progress: true

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Extract cities from Overture
        run: |
          pip install -r scripts/requirements.txt
          rm -rf public/data && mkdir -p public/data
          python scripts/extract.py --all
          ls -la public/data | head -60
          du -sh public/data
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish the data branch
        run: |
          cd public/data
          git init -q -b data
          git config user.name "Rajat Wasan"
          git config user.email "rajatwasan12@gmail.com"
          git add -A
          git commit -q -m "Overture extract $(python -c "import json;print(json.load(open('index.json'))['release'])")"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
          rm -rf .git
      - name: Stamp main so Netlify redeploys
        if: github.ref == 'refs/heads/main'
        run: |
          python -c "import json;d=json.load(open('public/data/index.json'));print(d['release'], d['generated'], len(d['cities']), 'cities')" > data-version.txt
          git config user.name "Rajat Wasan"
          git config user.email "rajatwasan12@gmail.com"
          git add data-version.txt
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "Data: $(cat data-version.txt)"
          git push
